name: Lighthouse CI

on:
  pull_request:
    branches: [ main ]

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Install dependencies
      - run: npm ci

      # 4️⃣ Build
      - run: npm run build

      # 5️⃣ Start dev server
      - run: npm start &
      - run: npx wait-on http://localhost:3000

      # 6️⃣ Run LHCI
      - name: Run Lighthouse CI
        run: |
          mkdir -p ./lhci_reports
          npx lhci autorun \
            --numberOfRuns=1 \
            --upload.target=filesystem \
            --upload.outputDir=./lhci_reports \
            --assert \
            --exit-on-error=true || echo "LHCI_FAILED=true" >> $GITHUB_ENV

      # 7️⃣ Parse manifest.json para sacar scores
      - name: Parse Lighthouse manifest
        id: lhci-summary
        run: |
          node -e "
          const fs = require('fs');
          const manifestPath = './lhci_reports/manifest.json';
          if (!fs.existsSync(manifestPath)) {
            console.error('Manifest JSON no encontrado!');
            process.exit(1);
          }
          const manifest = JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          if (!manifest.length) {
            console.error('Manifest JSON vacío!');
            process.exit(1);
          }
          const cats = manifest[0].summary;
          console.log('PERF='+Math.round(cats.performance*100));
          console.log('ACC='+Math.round(cats.accessibility*100));
          console.log('BP='+Math.round(cats['best-practices']*100));
          console.log('SEO='+Math.round(cats.seo*100));
          " >> $GITHUB_ENV

      # 9️⃣ Comentar en el PR
      - name: Comment PR with LHCI scores
        if: env.LHCI_FAILED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            async function createFailComment() {
              const perf = process.env.PERF;
              const acc = process.env.ACC;
              const bp = process.env.BP;
              const seo = process.env.SEO;

              const body = `
              📊 **Lighthouse CI Scores**
              - Performance: ${perf}
              - Accessibility: ${acc}
              - Best Practices: ${bp}
              - SEO: ${seo}
              `;

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }

            if (process.env.LHCI_FAILED === 'true') {
              await createFailComment();
              exit(1);
            } else {
              console.log('Lighthouse CI passed all assertions.');
      - name: Finish failure
        if: env.LHCI_FAILED == 'true'
        run: exit 1

      - name: Finish success
        if: env.LHCI_FAILED != 'true'
        run: echo "Lighthouse CI passed all assertions."

