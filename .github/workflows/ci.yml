name: Lighthouse CI

on:
  pull_request:
    branches: [main]

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Start server
        run: npm start & npx wait-on http://localhost:3000

      - name: Run Lighthouse CI
        id: lhci
        run: |
          mkdir -p ./lhci_reports
          npx lhci autorun --upload.target=filesystem --upload.outputDir=./lhci_reports || echo "LHCI_FAILED=true" >> $GITHUB_ENV

      - name: Upload Lighthouse Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: ./lhci_reports

      - name: Parse Lighthouse summary
        id: lhci-summary
        run: |
          node -e "const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('./lhci_reports/lhr-0.json','utf8'));
          const cats=report.categories;
          console.log('PERF='+Math.round(cats.performance.score*100));
          console.log('ACC='+Math.round(cats.accessibility.score*100));
          console.log('BP='+Math.round(cats['best-practices'].score*100));
          console.log('SEO='+Math.round(cats.seo.score*100));
          " >> $GITHUB_ENV

      - name: Comment PR with LHCI scores
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const perf = process.env.PERF;
            const acc = process.env.ACC;
            const bp = process.env.BP;
            const seo = process.env.SEO;

            const body = `
            📊 **Lighthouse Scores**
            - Performance: ${perf}
            - Accessibility: ${acc}
            - Best Practices: ${bp}
            - SEO: ${seo}
            `;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
